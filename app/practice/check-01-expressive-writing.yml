type: check
title: "Writing away exam nerves"
field: "Educational psychology"
story: >
  A psychology department wanted to know whether a simple ten-minute exercise could
  calm students before a high-stakes exam. On the morning of their first statistics
  exam, 67 first-year students were randomly assigned to one of two writing tasks in
  the exam hall's waiting room. Thirty-four wrote freely about their worries about the
  exam; the other 33 wrote about their plans for the rest of the day. Right before the
  papers were handed out, everyone filled in a 20-item state anxiety questionnaire,
  scored from 20 (very calm) to 80 (very anxious). The study was preregistered, and
  the paper reports the result in full APA style.
sharing_reason: >
  "The ethics committee approved the study on the condition that exam-day data, which
  could be linked to students' grades, stay within the department."
as_printed: >
  Students who wrote about their worries reported less anxiety (M = 41.3, SD = 9.8)
  than students who wrote about their plans (M = 47.6, SD = 10.4), t(65) = −2.55,
  p = .013, d = −0.62, 95% CI [−11.23, −1.37].
question: >
  Send the numbers to the checker. Do they fit together? How much of the result can a
  reader check from what is printed?
check:
  handler: t_independent
  reported:
    n: ["34", "33"]
    m: ["41.3", "47.6"]
    sd: ["9.8", "10.4"]
    t: "-2.55"
    df: "65"
    p: ".013"
    d: "-0.62"
    ci_lower: "-11.23"
    ci_upper: "-1.37"
  declared: {}
expected:
  checked: true
  consistent: true
answer: >
  Everything adds up, at the highest level (3): t, df, p, d and the confidence interval
  can all be recomputed from the group sizes, means and SDs, and they match. The numbers
  fit Student's t (equal variances), and d fits the usual formulas (pooled SD, Hedges'
  g). This is what a fully reported simple test looks like: APA's own list of numbers is
  already the sufficient set, so readers lose little without the raw data. The reason
  for not sharing is a real constraint, but worth discussing: anxiety scores with no
  student numbers or grades attached could probably be shared after all.
