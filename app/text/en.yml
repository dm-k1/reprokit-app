    One row per participant, one column per variable. For a paired test, put
    the two measurements in two columns.
  rds_label: Fitted model (.rds)
  rds_help: >-
    In R: `saveRDS(lm(y ~ x, data = d), "model.rds")`.
  rds_explain: >-
    reprokit reads the analysis from the model: a regression from `lm()`, an
    ANOVA from `aov()` or a test from `chisq.test()`. Other models still get
    a verdict, with the reason.
  rds_no_analysis: The model says which analysis it is; go on to the reason.
  test_label: Test
  columns_note: Rows with a missing value in these columns are left out.
  version_label: Version
  version_help: >-
    Welch's t is R's default; its df usually has decimals (e.g. 17.78).
  mu_label: Test value
  mu_help: The value the mean (or mean difference) was compared with.
  tails_label: Tails
  level_label: Confidence level
  correct_label: Continuity correction (2 x 2 tables)
  correct_choices:
    "TRUE": With Yates' correction (R's default)
    "FALSE": Without correction
  p0_label: Expected proportions (optional)
  p0_help: >-
    One per category, in order, separated by commas (e.g. 0.2, 0.3, 0.5).
    Empty means equally likely.
  reason_placeholder: e.g. Participants did not consent to sharing.
  reason_help_title: What counts as a good reason?
  reason_help: >-
    Your reason is printed in the appendix, next to what readers lose, so the
    app cannot become a polite excuse for not sharing.


    **Usually good:** no consent for sharing; people could be identified
    (small groups, rare combinations); a contract forbids it.


    **Worth a second look:** "too much work", "others might find mistakes",
    "the data are ours". Most refusals are not legal reasons (Chambers, 2019,
    ch. 4), and reluctance to share goes with more reporting errors
    (Wicherts et al., 2011). Could a data-use agreement work instead?
  threshold_label: Smallest safe group size
  threshold_help: >-
    Summaries of tiny groups are almost the raw data. Default 5; the total
    must be at least twice this.
  need_reason: "Step 3: say why the data cannot be shared."
  need_model: "Step 1: open a fitted model (.rds)."
  need_columns: Choose your data and columns first.
  read_error: The file could not be read as a table.
  read_hint: Check the separator and decimal mark.
  tabs:
    data: Your data
    verdict: Verdict
    appendix: Appendix
    lost: What readers lose
  data_empty: Choose your data in step 1 to see it here.
  data_rows: "{rows} rows, {cols} columns. The first rows:"
  codebook: In the file
  boxes:
    verdict: Verdict
    publish: To publish
    disclosure: Disclosure check
    waiting: Not run yet
    waiting_hint: Work through the steps on the left.
  waiting_title: Your data appear here
  verdict_why: Why
  disclosure_passed: Passed
  disclosure_flagged: Flagged
  disclosure_text: >-
    No group or cell may hold fewer than {threshold} cases, and the total must
    be at least twice that. This lowers the risk of identifying someone; it is
    no guarantee of anonymity or legal compliance.
  disclosure_checked: "Checked: {checked}."
  choices_title: Declare your choices
  choices_text: >-
    The appendix needs the choices the numbers cannot show. Declaring the
    effect size is this project's rule, not APA's.
  choices_none: This test has no choices to declare.
  convention_label: Effect size you reported
  ss_type_label: Sums of squares
  ss_type_help: Only matters for unequal group sizes. Default type III.
  ci_level_label: Confidence level in your paper
  not_declared: Not declared yet
  appendix_wait: Choose your effect size on the left to see the appendix.
  appendix_refused: >-
    No appendix: summaries cannot stand in for these data. See the Verdict tab
    for what to do instead.
  appendix_blocks_title: The four blocks
  appendix_blocks: |
    - **A.** The numbers APA asks for.
    - **B.** Numbers APA does not ask for but the result needs.
    - **C.** Your analysis choices.
    - **D.** APA numbers readers cannot check, and why.

    Then your reason, what readers lose, and the disclosure check.
  download: Download the appendix (.md)
  lost_title: What readers lose without the raw data
  lost_always: diagnostics, reanalysis with other methods, and fraud detection
  instead_title: What you can do instead
  instead:
    - share the raw data, if need be under a data-use agreement
    - share synthetic data and report how well it reproduces the results
    - offer analysis on request or federated analysis (e.g. DataSHIELD)
  suffice_next: Summaries are enough. Open **Appendix** to download it.

