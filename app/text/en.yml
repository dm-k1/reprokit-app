# Every word the app shows, in one place, so wording can be reviewed (and
# translated) without touching the code. Markdown is allowed in longer texts.
# Wording rules from the project plan: "consistent / inconsistent with the
# reported statistics", never "wrong"; the app implements an APA obligation, it
# does not go against APA. No emoji: icons come from Font Awesome (`icon:`).

app:
  title: Reproducibility oracle
  theme:
    dark: Dark mode
    light: Light mode
    hint: Switch between a light and a dark colour scheme
  intro: >-
    **Check whether a paper's statistics fit together**, or, if you cannot
    share your data, **find out which summary statistics let readers
    reproduce your results**. Both use the same numbers: what an author's
    appendix reports is exactly what a reader's check needs.

tabs:
  check: Check Paper
  share: Publish data
  help: Help
  practice: Practice examples

help:
  title: Help
  tabs:
    how: How it works
    practice: Practice examples
    results: Results
    words: Words
    coverage: Coverage
    apa: APA
    data: Data safety
  how_intro: >-
    Two tools and this Help tab. Every **?** opens a short explanation.
  check_for: For readers who want to check a paper's statistics
  check_steps:
    - Pick the test the paper reports.
    - Type its numbers exactly as printed.
    - Optionally, say what the paper claims it did.
    - >-
      Press **Check these numbers**: whether the numbers fit, how much could
      be checked, and what is missing.
  share_for: For authors who cannot share their data
  share_steps:
    - Open your data. It stays on your computer.
    - Pick the test you ran and its columns.
    - Say why the raw data cannot be shared (required).
    - >-
      Press **Check this dataset**: a verdict, what to publish, an appendix
      to paste into your paper, and what readers lose.
  practice_for: For learning
  practice_steps:
    - "Six fictional psychology studies: three papers, three datasets."
    - Read the story, then send it to the right tool with one click.
    - Decide what you think, then open the answer.
  apa_lead: >-
    APA asks authors to share their data and to report a sufficient set of
    statistics; the oracle helps authors meet that obligation and helps
    readers check that it was met.
  apa_text: >-
    APA style asks for "a sufficient set of statistics" but says what counts
    as sufficient cannot be specified in general. The oracle specifies it for
    each test, and checks whether a paper meets it.
  apa_rule_title: The rule behind everything here
  apa_rule_extra: >-
    The oracle is for when sharing is genuinely impossible: it tells you the
    minimum you still owe readers, and what they lose.
  data_title: What happens to my data?
  data_text: >-
    Nothing leaves your computer. Online, the app runs R inside your browser
    (webR); locally, it runs in R on your machine. Either way a file you open
    is read on your own computer and never uploaded. Protecting participants
    starts with not moving their data around.
  statuses_title: Status of each number
  levels_title: Coverage level
  verdicts_title: Verdicts for authors
  coverage_text: |
    - **apa:** what APA style asks a paper to report.
    - **sufficient:** what a reader needs to recompute the result.
    - **missing:** what an APA-style paper leaves out.
    - **checkable:** which APA numbers a reader can recompute.
    - **choices:** what the author must declare.

    Generated by reprokit, so it always matches what the checks do.

check:
  steps:
    test: Which test does the paper report?
    claims: What does the paper claim?
  next_step: Next
  go: Check these numbers
  clear: Clear the numbers
  example: See a practice example
  claims_help: >-
    Optional. The check tries every option anyway; this only lets the app
    compare its findings with the paper.
  version_label: t-test the paper names
  version_choices:
    "": Not stated (try both)
    student: Student's t (equal variances)
    welch: Welch's t (unequal variances)
  tail_label: Tails the paper names
  tail_choices:
    "": Not stated
    two.sided: two-sided
    less: one-sided (less)
    greater: one-sided (greater)
  nothing_to_claim: Nothing to declare for this test.
  tabs:
    numbers: Numbers
    result: Result
    numbers_detail: Number by number
    choices: Choices that fit
  numbers_title: Type the numbers exactly as printed
  numbers_subtitle: Leave a box empty if the paper does not report it.
  exact_title: Why exactly as printed?
  exact_text: >-
    "2.85" stands for anything from 2.845 to 2.855, and the check uses that
    whole range, so keep the paper's decimals. For p, ".010", "0.010" and
    "< .001" all work.
  test_reports: "APA style reports:"
  test_missing: "A full check also needs:"
  loaded_title: Practice example loaded
  loaded_text: Press **Check these numbers** to see the result.
  loaded_from_practice: "\"{title}\", from Practice examples."
  cells_title: Descriptives per group or condition
  cells_title_one: Descriptives
  results_title: Test results
  terms_title: Coefficients
  term_name: Term
  shape:
    groups: Number of groups
    categories: Number of categories
    rows: Levels of factor A (rows)
    cols: Levels of factor B (columns)
    table_rows: Rows of the table
    table_cols: Columns of the table
    terms: Number of coefficients
  mu_label: Test value (mu)
  mu_help: >-
    The value the mean (or mean difference) was compared with, usually 0. A
    setting of the test, so a plain number.
  k_label: Predictors in the model (k)
  k_help: >-
    The model's df1. Without it, n and df2 are not checked against each other;
    reprokit never guesses it.
  effect_label: Which F test?
  effect_help: A two-factor design has three F tests; check one at a time.
  effect_choices:
    A: Main effect of factor A (rows)
    B: Main effect of factor B (columns)
    AB: Interaction of A and B
  need_numbers: Type at least a few of the paper's numbers.
  need_all_cells: "{label}: fill in every group or cell, or none."
  need_term_names: Give every coefficient a name (e.g. the predictor's).
  error_hint: Type numbers as printed, e.g. 2.85, .010 or < .001.
  boxes:
    verdict: Verdict
    level: Coverage
    numbers: Numbers checked
    waiting: Not checked yet
    waiting_hint: Type the numbers, then press Check.
    level_value: "Level {level} of 3"
    numbers_value: "{checked} of {total}"
    numbers_hint: "{inconsistent} inconsistent, {unconfirmed} unconfirmed"
  verdicts:
    consistent:
      short: Consistent
      title: Consistent with the reported statistics
      text: >-
        Allowing for rounding and the usual analysis choices, the numbers can
        all be correct together. That says nothing about whether the analysis
        was appropriate.
    inconsistent:
      short: Inconsistent
      title: Inconsistent with the reported statistics
    unchecked:
      short: Not checkable
      title: No check was possible
      text: >-
        No formula of this test had all its numbers. A statistic with its df
        and p is usually enough for a first check.
  version_note:
    fits_other: >-
      The paper says {claimed}, but the numbers only fit {other}. The numbers
      may be fine and the method description loose, or the other way round.
    both: The numbers fit both Student's and Welch's t.
    one: "The paper does not say which t-test it used; the numbers fit {fits}."
    none: >-
      The numbers fit neither Student's nor Welch's t (details below assume
      Welch's, R's default).
  level_title: How much could be checked
  level_help: >-
    Coverage, not agreement: a fully consistent paper can still be checkable
    only at level 1.
  raise_title: What would raise the level
  raise_item: "{quantity} would raise it to level {level}"
  raise_range: "; it must lie between {range}."
  unreported_title: Numbers not reported
  unreported_text: >-
    To fit the rest, these must lie in the ranges shown (a constraint, not
    their true value):
  derived_text: "Not reported, but they follow exactly from another number:"
  derived_item: "{quantity} = {value} (from {from})"
  columns:
    number: Number
    reported: Reported
    status: Status
    meaning: What that means
    checked_with: Checked with
  choices_help: >-
    Every common option is tried; those under which all the numbers fit are
    ticked. All numbers of one result must fit the same choice.
  choices_none: This test has no analysis choices to try.
  claims_title: Compared with the paper
  claim_fits: The paper says **{claim}**, and the numbers fit it.
  claim_misfit: >-
    The paper says **{claim}**, but the numbers fit **{fits}**. The numbers
    may be fine and the method description loose, or the other way round.
  none_of_them: none of the options
  fair_title: Reading this fairly

share:
  steps:
    data: Your data
    analysis: Your analysis
    reason: Why can't the data be shared?
  next_step: Next
  go: Check this dataset
  source_label: Data
  sources:
    csv: CSV file
    rds: Model saved from R (.rds)
    demo: Practice dataset
  demo_label: Practice dataset
  csv_label: CSV file
  sep_label: Separator
  sep_help: Excel in many European countries uses semicolons.
  dec_label: Decimal mark
