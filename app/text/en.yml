reminders:
  standard: >-
    Sharing the raw data remains the standard. The APA Publication Manual
    (section 1.14) requires it, and the APA Ethics Code (Standard 8.14) forbids
    withholding data from qualified researchers who want to verify results.
  inconsistency: >-
    An inconsistency means the numbers cannot all be right as reported. It
    does not say which one is off, or why: a typo, another test, other
    rounding and a real error look the same.

statuses:
  verified:
    icon: circle-check
    class: success
    meaning: Recomputed from more basic numbers (e.g. t from n, M, SD); it matches.
  coherent:
    icon: check
    class: info
    meaning: Fits the other numbers, but was used only as an input.
  inconsistent:
    icon: xmark
    class: danger
    meaning: Cannot be right together with the other numbers. Not which one is off.
  not reproducible:
    icon: question
    class: warning
    meaning: No common formula gives it (typical for undeclared effect sizes). A remark.
  not coherent:
    icon: triangle-exclamation
    class: warning
    meaning: Does not fit as a product of the reported paths. A remark.
  unconfirmed:
    icon: ellipsis
    class: secondary
    meaning: Not checked, because a number it needs is not reported.
  not checkable:
    icon: minus
    class: light
    meaning: No formula of this test links it to the other numbers.
  not evaluable:
    icon: minus
    class: light
    meaning: Cannot be evaluated with these numbers (e.g. an expected count of 0).

verdicts:
  summaries_suffice:
    icon: circle-check
    short: Summaries suffice
    title: Summary statistics suffice
    class: success
    meaning: >-
      A small set of summary statistics reproduces your result exactly. The
      appendix lists them.
  synthetic_possible:
    icon: rotate
    short: Synthetic data possible
    title: Synthetic data possible
    class: warning
    meaning: >-
      Summaries cannot reproduce this exactly; synthetic data could,
      approximately. Share the raw data if you can.
  needs_raw_data:
    icon: lock
    short: Raw data needed
    title: Needs the raw data
    class: danger
    meaning: >-
      Summaries are not enough, or so close to the raw data that they protect
      no one.

levels:
  - Nothing could be checked.
  - The statistic, df, p and CI agree with each other.
  - The statistic was recomputed from the descriptives.
  - Everything needed to reproduce the analysis is reported.

glossary:
  Sufficient set: >-
    The fewest numbers from which a test's result can be recomputed exactly
    (two groups: n, mean and SD of each).
  APA set: The numbers APA style asks a paper to report for a test.
  Missing numbers: >-
    In the sufficient set but not in the APA set; for a paired t-test, the
    correlation between the two measurements.
  Choices to declare: >-
    Decisions the numbers do not show: tails, confidence level, Student or
    Welch, and the effect-size formula.
  Verdict: >-
    Whether summaries suffice, synthetic data could work, or the raw data are
    needed. Advice, not a judgement on the author.
  Disclosure check: >-
    No group or cell under 5 cases, at least 10 in total. Lowers the risk of
    identifying someone; not a legal guarantee.
  Rounding interval: >-
    "2.85" stands for anything from 2.845 to 2.855; so 2.850 and 2.85 are
    different claims.
  Relation: A formula linking reported numbers, such as p from t and df.
  Variant: >-
    One set of analysis choices (e.g. Welch's t, two-sided, 95%). All numbers
    of one result must fit the same variant.
  Coverage level: >-
    How much of the result can be checked, from 0 (nothing) to 3 (everything
    needed to reproduce it).
  Implied range: >-
    The range an unreported number must lie in for the others to fit; a
    constraint, not its true value.

quantities:
  n:
    label: "Sample size (n)"
    help: "How many people (or cases) the result rests on. For a table of counts, the count in each cell."
  m:
    label: "Mean (M)"
    help: "The average, exactly as printed in the paper."
  sd:
    label: "Standard deviation (SD)"
    help: "How spread out the scores are, exactly as printed."
  r:
    label: "Correlation (r)"
    help: "For a paired test: the correlation between the two measurements. Papers rarely report it."
  t:
    label: "t value"
    help: "The test statistic, e.g. the 2.85 in t(19) = 2.85."
  f:
    label: "F value"
    help: "The test statistic, e.g. the 4.85 in F(2, 27) = 4.85."
  chisq:
    label: "Chi-squared"
    help: "The test statistic, e.g. the 5.82 in chi-squared(1) = 5.82."
  df:
    label: "Degrees of freedom (df)"
    help: "The number in brackets, e.g. the 19 in t(19)."
  df1:
    label: "df, first number"
    help: "The first number in F(2, 27)."
  df2:
    label: "df, second number"
    help: "The second number in F(2, 27)."
  p:
    label: "p value"
    help: "As printed: .010, 0.01 and < .001 all work."
  d:
    label: "Effect size (d or g)"
    help: "Cohen's d, Hedges' g or similar. The check tries every common way of computing it."
  eta2:
    label: "Eta squared"
    help: "The ANOVA's effect size (partial eta squared for a two-factor design)."
  ci_lower:
    label: "CI, lower bound"
    help: "The first number in [0.21, 1.40]."
  ci_upper:
    label: "CI, upper bound"
    help: "The second number in [0.21, 1.40]."
  n_total:
    label: "Total N"
    help: "The total number of cases in the table."
  v:
    label: "Effect size (V or w)"
    help: "Cramer's V for a table, Cohen's w for goodness of fit."
  p0:
    label: "Expected proportion"
    help: "Optional: the proportion this category has under the null hypothesis. Leave all empty for equally likely categories."
  b:
    label: "Coefficient (b)"
    help: "The unstandardised coefficient."
  se:
    label: "Standard error (SE)"
    help: "The coefficient's standard error."
  beta:
    label: "Standardised coefficient (beta)"
    help: "The coefficient in SD units."
  r2:
    label: "R squared"
    help: "The proportion of variance the model explains."
  p_model:
    label: "p of the model"
    help: "The p value of the model's F test."
  indirect:
    label: "Indirect effect (a x b)"
    help: "The size of the mediated effect."
  indirect_ci_lower:
    label: "Indirect effect CI, lower"
    help: "Usually a bootstrap interval. It cannot be checked."
  indirect_ci_upper:
    label: "Indirect effect CI, upper"
    help: "Usually a bootstrap interval. It cannot be checked."

relations:
  df_from_n: df from the sample size
  df1_from_n: first df from the number of groups
  df2_from_n: second df from the sample sizes
  df1_from_dims: first df from the design
  df_from_dims: df from the table's shape
  t_from_descriptives: t recomputed from n, M and SD
  f_from_descriptives: F recomputed from n, M and SD
  p_from_descriptives: p recomputed from n, M and SD
  p_from_t: p from t and df
  p_from_f: p from F and df
  p_from_chisq: p from chi-squared and df
  p_from_table: p recomputed from the counts
  chisq_from_table: chi-squared recomputed from the counts
  chisq_from_counts: chi-squared recomputed from the counts
  t_from_r: t from r and df
  t_from_b_se: t from b and SE
  f_from_r2: F from R squared and df
  f_from_t: F from t (F = t squared)
  eta2_from_f: eta squared from F and df
  v_from_table: V from the counts
  v_from_chisq: V from chi-squared and N
  w_from_chisq: w from chi-squared and N
  ci_lower_from_descriptives: CI lower bound from n, M and SD
  ci_upper_from_descriptives: CI upper bound from n, M and SD
  ci_lower_from_r: CI lower bound from r and n
  ci_upper_from_r: CI upper bound from r and n
  d_from_descriptives: d from M and SD
  d_av_from_descriptives: d (average-SD versions) from M and SD

variant_kinds:
  tail: Tails
  level: Confidence level
  test: Test version
  convention: Effect-size formula
  ss_type: Sums of squares

variant_labels:
  two.sided: two-sided
  less: one-sided (less)
  greater: one-sided (greater)
  "0.90": 90%
  "0.95": 95%
  "0.99": 99%
  student: Student's t
  welch: Welch's t
  pearson: without continuity correction
  yates: with Yates' correction
